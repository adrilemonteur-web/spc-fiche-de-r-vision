<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPC — L'Essentiel en 15 lignes</title>
  <style>
    :root {
      --bg: #070b17; --bg2: #0d1324; --line: rgba(255, 255, 255, 0.14);
      --text: #eef4ff; --muted: #a8b4d1; --cyan: #68e4ff; --blue: #5b7cff;
      --violet: #a56bff; --pink: #ff66c4; --panel: rgba(255,255,255,0.03);
      --modal-bg: #0d1324; --card-bg: rgba(255,255,255,0.04);
      --btn-bg: rgba(255,255,255,0.06);
    }
    body.light-theme {
      --bg: #f4f7f6; --bg2: #ffffff; --line: rgba(0, 0, 0, 0.1);
      --text: #1a202c; --muted: #4a5568; --cyan: #006da0; --blue: #2b6cb0;
      --violet: #6b46c1; --pink: #d53f8c; --panel: rgba(0,0,0,0.03);
      --modal-bg: #ffffff; --card-bg: #ffffff;
      --btn-bg: rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; } html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); transition: background-color 0.3s, color 0.3s; min-height: 100vh; overflow-x: hidden; }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(circle at 10% 10%, rgba(91,124,255,.15), transparent 26%),
                  radial-gradient(circle at 72% 70%, rgba(104,228,255,.10), transparent 26%),
                  linear-gradient(rgba(120,120,120,.05) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(120,120,120,.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 34px 34px, 34px 34px;
      z-index: -1; pointer-events: none; transition: 0.3s;
    }
    body.light-theme::before { opacity: 0.6; background-color: var(--bg); }

    .wrap { position: relative; z-index: 1; width: min(1200px, calc(100% - 32px)); margin: 0 auto; }
    .hero { padding: 32px 0 18px; }
    .topbar { position: sticky; top: 14px; z-index: 20; backdrop-filter: blur(18px); background: var(--card-bg); border: 1px solid var(--line); border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--cyan), var(--blue) 45%, var(--pink)); display: grid; place-items: center; font-weight: 900; color: #fff; }
    .brand-text small { color: var(--muted); text-transform: uppercase; font-size: 0.72rem; }
    .brand-text strong { display: block; font-size: 0.98rem; }

    .top-actions { display: flex; gap: 10px; }
    .btn { cursor: pointer; background: var(--btn-bg); color: var(--text); border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn:hover { background: var(--line); }

    h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 20px 0 10px; line-height: 1.1; }
    .gradient { background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%); -webkit-background-clip: text; color: transparent; }
    .lead { color: var(--muted); font-size: 1.1rem; line-height: 1.6; max-width: 650px; }

    .theme-block { margin-top: 40px; } .theme-head h2 { font-size: 2rem; margin: 0 0 15px 0; color: var(--text); border-bottom: 2px solid var(--line); padding-bottom: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

    .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px; padding: 24px; cursor: pointer; position: relative; display: flex; flex-direction: column; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); border-radius: 20px 20px 0 0; }
    .card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
    .card-top { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
    .seq { text-transform: uppercase; letter-spacing: 1px; font-weight: bold; color: var(--cyan); background: var(--btn-bg); padding: 4px 10px; border-radius: 8px; }
    .card h3 { margin: 0 0 10px 0; font-size: 1.3rem; line-height: 1.4; color: var(--text); }
    .card p { color: var(--muted); font-size: 0.95rem; margin: 0 0 20px 0; line-height: 1.5; flex-grow: 1; }
    .open-btn { display: inline-block; padding: 12px 0 0; color: var(--cyan); font-weight: 600; font-size: 0.95rem; border-top: 1px dashed var(--line); width: 100%; text-align: right; }

    /* Fenêtre modale de la fiche */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; pointer-events: none; display: flex; justify-content: center; align-items: flex-start; transition: 0.3s; padding: 40px 20px; overflow-y: auto; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--modal-bg); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 850px; padding: 50px; position: relative; transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.1, 0, 0.1, 1); box-shadow: 0 30px 60px rgba(0,0,0,0.5); margin-bottom: 40px; color: var(--text); }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

    .modal-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
    .action-btn { background: var(--btn-bg); border: 1px solid var(--line); color: var(--text); width: 44px; height: 44px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: grid; place-items: center; transition: 0.2s; }
    .action-btn:hover { background: var(--cyan); color: #fff; }
    .close-btn:hover { background: var(--pink); transform: rotate(90deg); }

    .modal-header { border-bottom: 2px solid var(--line); padding-bottom: 20px; margin-bottom: 30px; }
    .modal-header h2 { margin: 10px 0 0; font-size: 2.2rem; line-height: 1.2; }

    /* Contenu de la fiche (~15 lignes) */
    .modal-body p { font-size: 1.15rem; line-height: 1.8; margin-bottom: 20px; color: var(--text); text-align: justify; }
    .modal-body p strong { color: var(--cyan); }

    /* Affichage des schémas (1 à 2 max côte à côte) */
    .schemas-wrapper { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
    .schema-container { flex: 1; min-width: 250px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 15px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .schema-container img { max-width: 100%; max-height: 350px; border-radius: 8px; object-fit: contain; }
    .schema-caption { margin-top: 10px; font-size: 0.9rem; color: var(--muted); font-style: italic; }

    /* Version impression (Masque l'interface, garde juste la fiche blanche) */
    @media print {
      body * { visibility: hidden; }
      .modal-overlay { position: absolute; left: 0; top: 0; background: white; padding: 0; }
      .modal-content, .modal-content * { visibility: visible; color: black !important; box-shadow: none; border: none; background: white !important; }
      .modal-content { max-width: 100%; padding: 0; transform: none; position: absolute; left: 0; top: 0; }
      .action-btn { display: none; }
      .modal-body p strong { color: black !important; font-weight: 800; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="topbar">
        <div class="brand"><div class="logo">SPC</div><div class="brand-text"><strong>L'Essentiel 3ème</strong></div></div>
        <div class="top-actions">
          <button id="themeToggle" class="btn">☀️ Clair</button>
        </div>
      </div>
      <h1><span class="gradient">L'Essentiel à retenir</span><br>Fiches Synthétiques</h1>
      <p class="lead">Des fiches parfaites de ~15 lignes (3 paragraphes), qui résument le cœur de ce que tu dois apprendre par séquence, illustrées de 1 à 2 schémas issus du cours.</p>
    </header>

    <main>
      <section id="theme-a" class="theme-block"><div class="theme-head"><h2>Thème A : Matière</h2></div><div class="cards" id="cardsA"></div></section>
      <section id="theme-b" class="theme-block"><div class="theme-head"><h2>Thème B : Énergie</h2></div><div class="cards" id="cardsB"></div></section>
    </main>
  </div>

  <div id="ficheModal" class="modal-overlay" onclick="fermerModalSiClicDehors(event)">
    <div class="modal-content">
      <div class="modal-actions">
        <button class="action-btn" onclick="window.print()" title="Imprimer cette fiche">🖨️</button>
        <button class="action-btn close-btn" onclick="fermerModal()" title="Fermer">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const courseData = {"A": [{"num": "1", "title": "Outils mathématiques et précision", "html": "<p><strong>Précision des mesures :</strong> En sciences, aucune mesure n'est exacte. Les chiffres significatifs traduisent cette précision. Lors d'un calcul (multiplication/division), le résultat final ne doit pas comporter plus de chiffres significatifs que la donnée qui en possède le moins.</p>\n                       <p><strong>Notation scientifique et ordre de grandeur :</strong> Pour manipuler des nombres très grands (distance spatiale) ou très petits (taille d'un atome), on utilise la forme <strong>a &times; 10<sup>n</sup></strong> (avec 1 &le; a &lt; 10). L'ordre de grandeur est la puissance de 10 la plus proche ; il permet de vérifier rapidement la cohérence d'un résultat.</p>\n                       <p><strong>Conversions indispensables :</strong> Il est crucial de maîtriser les préfixes multiplicateurs du système international : Giga (10<sup>9</sup>), Méga (10<sup>6</sup>), kilo (10<sup>3</sup>) pour les grands, et milli (10<sup>-3</sup>), micro (10<sup>-6</sup>), nano (10<sup>-9</sup>) pour les petits. Rappel : 1 mL = 1 cm<sup>3</sup> et 1 L = 1 dm<sup>3</sup>.</p>", "images": ["images_v4/schema_A_1_1.png", "images_v4/schema_A_1_2.png"]}, {"num": "2", "title": "Réchauffement climatique et océans", "html": "<p><strong>Mécanismes de la montée des eaux :</strong> Contrairement aux idées reçues, la fonte de la banquise (glace flottant sur l'eau, comme les icebergs) <em>ne fait pas</em> monter le niveau des océans, car elle déplace un volume d'eau égal à son propre poids.</p>\n                       <p><strong>Les véritables causes :</strong> La hausse du niveau de la mer est principalement due à deux phénomènes. D'une part, la <strong>fonte des glaces continentales</strong> (calottes glaciaires de l'Antarctique et du Groenland, glaciers de montagne) qui ajoute de l'eau nouvelle dans l'océan.</p>\n                       <p><strong>La dilatation thermique :</strong> D'autre part, lorsque la température de l'eau augmente, l'agitation des molécules s'intensifie. L'eau occupe alors un volume plus important : c'est la dilatation thermique. La masse volumique de l'eau (&rho; = m / V) diminue donc lorsque l'océan se réchauffe.</p>", "images": ["images_v4/schema_A_2_1.png", "images_v4/schema_A_2_2.png"]}, {"num": "3", "title": "Identifier un métal par sa masse volumique", "html": "<p><strong>Propriété caractéristique :</strong> Chaque matériau possède une masse volumique (&rho;) qui lui est propre. Elle représente la masse d'un matériau pour un volume donné. Les métaux courants ont des valeurs précises : Aluminium (2,7 g/cm<sup>3</sup>), Zinc (7,1 g/cm<sup>3</sup>), Fer (7,9 g/cm<sup>3</sup>), Cuivre (9,0 g/cm<sup>3</sup>).</p>\n                       <p><strong>Méthode de mesure de la masse :</strong> On utilise une balance électronique. Si l'objet doit être placé dans un récipient, il est indispensable d'utiliser la fonction <strong>Tare</strong> pour ne mesurer que la masse de l'échantillon.</p>\n                       <p><strong>Méthode de mesure du volume :</strong> Pour un solide de forme irrégulière, on utilise la technique du déplacement d'eau. On lit le volume initial (V<sub>i</sub>) dans une éprouvette graduée, on immerge doucement le solide, puis on lit le volume final (V<sub>f</sub>). Le volume du solide est <strong>V = V<sub>f</sub> - V<sub>i</sub></strong>. On calcule ensuite &rho; = m / V pour identifier le métal.</p>", "images": ["images_v4/schema_A_3_1.png", "images_v4/schema_A_3_2.png"]}, {"num": "4", "title": "Structure des atomes et éléments", "html": "<p><strong>Modèle de l'atome :</strong> L'atome est le bloc de base de la matière. Il est constitué d'un <strong>noyau central</strong> (chargé positivement) autour duquel gravitent des <strong>électrons</strong> (chargés négativement) dans un espace immense. L'atome est dit \"lacunaire\" car il est composé à 99,99% de vide.</p>\n                       <p><strong>Composition du noyau :</strong> Le noyau contient des <strong>nucléons</strong>, qui se divisent en deux catégories : les protons (charge positive) et les neutrons (charge neutre). L'atome étant électriquement neutre, il possède toujours <em>autant d'électrons que de protons</em>.</p>\n                       <p><strong>Notation symbolique :</strong> Un élément est représenté par <strong><sup>A</sup><sub>Z</sub>X</strong>. <strong>Z</strong> est le numéro atomique (nombre de protons). <strong>A</strong> est le nombre de masse (total des nucléons). Pour trouver le nombre de neutrons (N), on effectue simplement la soustraction : <strong>N = A - Z</strong>.</p>", "images": []}, {"num": "6", "title": "La formation des ions", "html": "<p><strong>Définition d'un ion :</strong> Lors de certaines réactions ou dissolutions, un atome (ou un groupe d'atomes) peut gagner ou perdre un ou plusieurs électrons. Il n'est alors plus électriquement neutre et devient un <strong>ion</strong>. Attention : le noyau (les protons) ne change jamais lors de la formation d'un ion !</p>\n                       <p><strong>Les Cations (positifs) :</strong> Un cation est un atome qui a <em>perdu</em> des électrons (des charges négatives). Il se retrouve donc avec un excès de charges positives. Exemple : l'ion cuivre Cu<sup>2+</sup> a perdu 2 électrons.</p>\n                       <p><strong>Les Anions (négatifs) :</strong> Un anion est un atome qui a <em>gagné</em> des électrons. Il possède donc un excès de charges négatives. Exemple : l'ion chlorure Cl<sup>-</sup> a gagné 1 électron. Les solutions ioniques conduisent le courant grâce au déplacement de ces ions.</p>", "images": []}, {"num": "8", "title": "Tests de reconnaissance des ions (M. Oups)", "html": "<p><strong>Le principe des tests :</strong> Pour identifier les ions invisibles dissous dans une solution aqueuse, on utilise des réactifs chimiques spécifiques. Si l'ion recherché est présent, une réaction a lieu et un solide coloré, appelé <strong>précipité</strong>, apparaît au fond du tube à essai.</p>\n                       <p><strong>Test au Nitrate d'argent :</strong> Ce réactif permet de détecter l'ion chlorure (Cl<sup>-</sup>). En sa présence, il se forme un <strong>précipité blanc qui noircit à la lumière</strong>.</p>\n                       <p><strong>Tests à la Soude (Hydroxyde de sodium) :</strong> La soude est le réactif de base pour repérer les ions métalliques. Elle donne un précipité <strong>bleu</strong> avec l'ion Cuivre II (Cu<sup>2+</sup>), un précipité <strong>vert</strong> avec l'ion Fer II (Fe<sup>2+</sup>), et un précipité <strong>rouille (orangé)</strong> avec l'ion Fer III (Fe<sup>3+</sup>).</p>", "images": []}, {"num": "11", "title": "Solutions acides, basiques et neutres (Le pH)", "html": "<p><strong>L'échelle de pH :</strong> Le pH (potentiel Hydrogène) permet d'évaluer l'acidité d'une solution aqueuse sur une échelle allant de 0 à 14. On le mesure rapidement avec du papier pH (couleur) ou précisément avec un appareil électronique appelé <strong>pH-mètre</strong>.</p>\n                       <p><strong>Interprétation microscopique :</strong> L'acidité dépend de la concentration en ions hydrogène (H<sup>+</sup>) et en ions hydroxyde (HO<sup>-</sup>). Une solution est <strong>neutre (pH = 7)</strong> quand elle contient autant d'ions H<sup>+</sup> que de HO<sup>-</sup>.</p>\n                       <p><strong>Acide et Basique :</strong> Une solution est <strong>acide (pH &lt; 7)</strong> si les ions H<sup>+</sup> sont majoritaires. Elle est <strong>basique (pH &gt; 7)</strong> si les ions HO<sup>-</sup> sont majoritaires. Attention au danger : plus le pH s'éloigne de 7 (vers 0 ou vers 14), plus la solution est corrosive. Diluer un acide fait remonter son pH vers 7.</p>", "images": []}, {"num": "15", "title": "Action d'un acide sur un métal", "html": "<p><strong>Observations expérimentales :</strong> Lorsqu'on verse de l'acide chlorhydrique (solution contenant des ions H<sup>+</sup> et Cl<sup>-</sup>) sur de la poudre de fer, une <strong>effervescence</strong> se produit : un gaz s'échappe. De plus, la température augmente, il s'agit d'une réaction exothermique.</p>\n                       <p><strong>Identification des produits :</strong> Le gaz dégagé est du <strong>dihydrogène (H<sub>2</sub>)</strong>. On le prouve en approchant une allumette enflammée : une petite détonation (un \"pop\") se fait entendre. La solution finale devient verdâtre, indiquant la formation d'ions Fer II (Fe<sup>2+</sup>).</p>\n                       <p><strong>Bilan et équation :</strong> C'est une transformation chimique où les réactifs (Fer solide et ions H<sup>+</sup>) disparaissent pour former des produits (gaz H<sub>2</sub> et ions Fe<sup>2+</sup>). L'équation bilan équilibrée s'écrit : <strong>Fe + 2 H<sup>+</sup> &rarr; H<sub>2</sub> + Fe<sup>2+</sup></strong> (les ions chlorure Cl<sup>-</sup> sont dits spectateurs).</p>", "images": []}], "B": [{"num": "4", "title": "L'énergie mécanique et la chute d'un corps", "html": "<p><strong>Énergie cinétique et de position :</strong> Tout objet en mouvement possède une <strong>énergie cinétique (Ec)</strong> qui dépend de sa masse et de sa vitesse : <strong>Ec = &frac12; &times; m &times; v<sup>2</sup></strong>. Tout objet en hauteur possède une <strong>énergie de position (Ep)</strong> liée à l'attraction terrestre.</p>\n                       <p><strong>L'énergie mécanique (Em) :</strong> L'énergie mécanique est simplement la somme des deux : <strong>Em = Ec + Ep</strong>. C'est l'énergie totale liée au mouvement et à la position du système.</p>\n                       <p><strong>Conversions et conservation :</strong> Lors de la chute libre d'un objet (comme le wagon d'une montagne russe qui descend), il perd de la hauteur (Ep diminue) mais gagne de la vitesse (Ec augmente). L'énergie de position est <strong>convertie</strong> en énergie cinétique. S'il n'y a pas de frottements de l'air, l'énergie mécanique totale se <strong>conserve</strong> (Em reste constante).</p>", "images": ["images_v4/schema_B_4_1.png", "images_v4/schema_B_4_2.png"]}, {"num": "7", "title": "La pile électrochimique", "html": "<p><strong>Principe du convertisseur :</strong> Une pile est un convertisseur d'énergie. Elle transforme l'<strong>énergie chimique</strong> (stockée dans ses réactifs) en <strong>énergie électrique</strong> (utile au circuit) et dissipe inévitablement de l'<strong>énergie thermique</strong> (chaleur perdue).</p>\n                       <p><strong>Fonctionnement microscopique :</strong> Dans une pile Cuivre-Zinc, le pôle négatif (anode) est la lame de zinc. Les atomes de zinc s'usent en perdant des électrons pour devenir des ions Zn<sup>2+</sup> dans la solution. Ces électrons voyagent dans les fils électriques, créant le courant.</p>\n                       <p><strong>Bilan de la pile :</strong> Arrivés au pôle positif (cathode en cuivre), les électrons réagissent avec les ions Cu<sup>2+</sup> de la solution pour former un dépôt d'atomes de cuivre solide. L'équation globale est : <strong>Zn + Cu<sup>2+</sup> &rarr; Zn<sup>2+</sup> + Cu</strong>.</p>", "images": ["images_v4/schema_B_7_1.png", "images_v4/schema_B_7_2.png"]}, {"num": "8", "title": "Production industrielle d'électricité", "html": "<p><strong>Le point commun des centrales :</strong> Qu'elle soit nucléaire, thermique à flamme, hydraulique ou éolienne, toute centrale électrique produit du courant grâce à un composant central indispensable : <strong>l'Alternateur</strong>.</p>\n                       <p><strong>Rotor, Stator et Turbine :</strong> L'alternateur est composé d'une bobine de cuivre fixe (le <strong>stator</strong>) et d'un électro-aimant mobile (le <strong>rotor</strong>). Pour faire tourner ce rotor, on utilise une <strong>turbine</strong> mise en mouvement par de l'eau, du vent, ou de la vapeur sous très haute pression.</p>\n                       <p><strong>Sources d'énergie primaire :</strong> L'énergie initiale servant à faire tourner la turbine peut être renouvelable (inépuisable à l'échelle humaine : vent, soleil, géothermie, eau) ou non renouvelable (stocks limités : uranium, pétrole, charbon, gaz naturel).</p>", "images": ["images_v4/schema_B_8_1.png"]}, {"num": "9", "title": "Le phénomène d'induction", "html": "<p><strong>Créer du courant sans pile :</strong> Il est possible de générer une tension électrique avec seulement deux éléments : un <strong>aimant</strong> (qui crée un champ magnétique) et une <strong>bobine de fil conducteur</strong>. C'est ce principe qui est utilisé dans les dynamos de vélo.</p>\n                       <p><strong>Condition de mouvement :</strong> Pour que le courant apparaisse, il faut absolument qu'il y ait un <strong>mouvement relatif</strong> entre l'aimant et la bobine. Si l'aimant est immobile à l'intérieur de la bobine, la tension mesurée par le voltmètre est nulle (0 V).</p>\n                       <p><strong>Tension alternative :</strong> Le mouvement de va-et-vient (ou la rotation continue) génère une tension qui change sans cesse de signe (positive, puis négative, etc.). On l'appelle une tension <strong>alternative</strong>. Plus le mouvement est rapide, plus la tension maximale générée sera élevée.</p>", "images": ["images_v4/schema_B_9_1.png", "images_v4/schema_B_9_2.png"]}, {"num": "10", "title": "Caractéristiques de la tension du secteur", "html": "<p><strong>Nature du courant domestique :</strong> La tension délivrée par les prises de courant (Réseau EDF en France) n'est pas continue comme celle d'une pile. C'est une tension <strong>alternative</strong> (change de sens) et <strong>sinusoïdale</strong> (sa courbe forme des vagues régulières).</p>\n                       <p><strong>Tension maximale et efficace :</strong> La tension du secteur oscille entre un maximum (U<sub>max</sub> = 325 V) et un minimum (U<sub>min</sub> = -325 V). Cependant, la valeur utile inscrite sur les appareils est la <strong>tension efficace (U<sub>eff</sub>)</strong>, qui vaut 230 V. La relation est : U<sub>max</sub> = U<sub>eff</sub> &times; &radic;2.</p>\n                       <p><strong>Période et Fréquence :</strong> La tension reproduit un motif élémentaire de manière cyclique. La <strong>période (T)</strong> est la durée de ce motif. La <strong>fréquence (f)</strong> est le nombre de motifs par seconde. En France, f = 50 Hz, ce qui donne une période très courte de T = 1/50 = 0,02 seconde !</p>", "images": ["images_v4/schema_B_10_1.png", "images_v4/schema_B_10_2.png"]}, {"num": "11", "title": "Comprendre et utiliser un oscilloscope", "html": "<p><strong>Qu'est-ce qu'un oscilloscope ?</strong> C'est un appareil de mesure qui permet de visualiser l'évolution d'une tension électrique au cours du temps. L'écran affiche une courbe appelée un oscillogramme.</p>\n                       <p><strong>Lecture de l'axe horizontal (le Temps) :</strong> L'axe des abscisses (X) représente le temps. Il est paramétré par le <strong>balayage</strong> (noté <em>b</em>, en ms/DIV ou s/DIV). Pour trouver la période (T) d'un signal, on compte le nombre de carreaux (X) d'un motif complet : <strong>T = b &times; X</strong>.</p>\n                       <p><strong>Lecture de l'axe vertical (la Tension) :</strong> L'axe des ordonnées (Y) représente la tension. Il est réglé par la <strong>sensibilité verticale</strong> (notée <em>s</em>, en V/DIV). Pour trouver la tension maximale (U<sub>max</sub>), on mesure la hauteur en carreaux (Y) du pic par rapport au centre : <strong>U<sub>max</sub> = s &times; Y</strong>.</p>", "images": ["images_v4/schema_B_11_1.png", "images_v4/schema_B_11_2.png"]}]};

    function generateHTML() {
      const cardsA = document.getElementById("cardsA"), cardsB = document.getElementById("cardsB");

      let htmlA = "";
      courseData.A.forEach((seq, index) => { 
        htmlA += `<div class="card" style="--accent: var(--cyan)" onclick="ouvrirModal('A', ${index})">
        <div class="card-top"><span class="seq">Séquence ${seq.num}</span></div>
        <h3>${seq.title}</h3><p>Clique pour lire la synthèse et voir les schémas...</p>
        <div class="open-btn">Ouvrir la fiche de révision ➔</div></div>`; 
      }); 
      cardsA.innerHTML = htmlA;

      let htmlB = "";
      courseData.B.forEach((seq, index) => { 
        htmlB += `<div class="card" style="--accent: var(--violet)" onclick="ouvrirModal('B', ${index})">
        <div class="card-top"><span class="seq">Séquence ${seq.num}</span></div>
        <h3>${seq.title}</h3><p>Clique pour lire la synthèse et voir les schémas...</p>
        <div class="open-btn">Ouvrir la fiche de révision ➔</div></div>`; 
      }); 
      cardsB.innerHTML = htmlB;
    }

    function ouvrirModal(themeKey, index) {
      const seq = courseData[themeKey][index];
      const themeColor = themeKey === 'A' ? 'var(--cyan)' : 'var(--violet)';

      let imagesHTML = "";
      if (seq.images && seq.images.length > 0) {
        imagesHTML = `<div class="schemas-wrapper">`;
        seq.images.forEach((imgSrc, i) => {
            imagesHTML += `<div class="schema-container">
                             <img src="${imgSrc}" alt="Schéma ${i+1}">
                             <div class="schema-caption">Illustration issue du cours</div>
                           </div>`;
        });
        imagesHTML += `</div>`;
      }

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-header">
          <span style="color: ${themeColor}; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">
            Thème ${themeKey} — Séquence ${seq.num}
          </span>
          <h2>${seq.title}</h2>
        </div>
        <div class="modal-body">
          ${imagesHTML}
          ${seq.html}
        </div>
      `;
      document.getElementById('ficheModal').classList.add('active');
    }

    function fermerModal() { document.getElementById('ficheModal').classList.remove('active'); }
    function fermerModalSiClicDehors(event) { if (event.target.id === 'ficheModal') fermerModal(); }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerModal(); });

    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      themeBtn.innerHTML = document.body.classList.contains('light-theme') ? '🌙 Sombre' : '☀️ Clair';
    });

    generateHTML();
  </script>
</body>
</html>
