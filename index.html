<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPC — Révisions & QCM Brevet</title>
  <style>
    :root {
      --bg: #070b17; --bg2: #0d1324; --line: rgba(255, 255, 255, 0.14);
      --text: #eef4ff; --muted: #a8b4d1; --cyan: #68e4ff; --blue: #5b7cff;
      --violet: #a56bff; --pink: #ff66c4; --panel: rgba(255,255,255,0.03);
      --modal-bg: #0d1324; --card-bg: rgba(255,255,255,0.04);
      --btn-bg: rgba(255,255,255,0.06);
    }
    body.light-theme {
      --bg: #f4f7f6; --bg2: #ffffff; --line: rgba(0, 0, 0, 0.1);
      --text: #1a202c; --muted: #4a5568; --cyan: #006da0; --blue: #2b6cb0;
      --violet: #6b46c1; --pink: #d53f8c; --panel: rgba(0,0,0,0.03);
      --modal-bg: #ffffff; --card-bg: #ffffff;
      --btn-bg: rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; } html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); transition: background-color 0.3s, color 0.3s; min-height: 100vh; overflow-x: hidden; }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(circle at 10% 10%, rgba(91,124,255,.15), transparent 26%),
                  radial-gradient(circle at 72% 70%, rgba(104,228,255,.10), transparent 26%),
                  linear-gradient(rgba(120,120,120,.05) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(120,120,120,.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 34px 34px, 34px 34px;
      z-index: -1; pointer-events: none; transition: 0.3s;
    }
    body.light-theme::before { opacity: 0.6; background-color: var(--bg); }

    .wrap { position: relative; z-index: 1; width: min(1200px, calc(100% - 32px)); margin: 0 auto; }
    .hero { padding: 32px 0 18px; }
    .topbar { position: sticky; top: 14px; z-index: 20; backdrop-filter: blur(18px); background: var(--card-bg); border: 1px solid var(--line); border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--cyan), var(--blue) 45%, var(--pink)); display: grid; place-items: center; font-weight: 900; color: #fff; }
    .brand-text small { color: var(--muted); text-transform: uppercase; font-size: 0.72rem; }
    .brand-text strong { display: block; font-size: 0.98rem; }

    .top-actions { display: flex; gap: 10px; }
    .btn { cursor: pointer; background: var(--btn-bg); color: var(--text); border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn:hover { background: var(--line); }

    h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 20px 0 10px; line-height: 1.1; }
    .gradient { background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%); -webkit-background-clip: text; color: transparent; }
    .lead { color: var(--muted); font-size: 1.1rem; line-height: 1.6; max-width: 650px; }

    .theme-block { margin-top: 40px; } .theme-head h2 { font-size: 2rem; margin: 0 0 15px 0; color: var(--text); border-bottom: 2px solid var(--line); padding-bottom: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

    .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px; padding: 24px; cursor: pointer; position: relative; display: flex; flex-direction: column; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); border-radius: 20px 20px 0 0; }
    .card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
    .card-top { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
    .seq { text-transform: uppercase; letter-spacing: 1px; font-weight: bold; color: var(--cyan); background: var(--btn-bg); padding: 4px 10px; border-radius: 8px; }
    .card h3 { margin: 0 0 10px 0; font-size: 1.3rem; line-height: 1.4; color: var(--text); }
    .card p { color: var(--muted); font-size: 0.95rem; margin: 0 0 20px 0; line-height: 1.5; flex-grow: 1; }
    .open-btn { display: inline-block; padding: 12px 0 0; color: var(--cyan); font-weight: 600; font-size: 0.95rem; border-top: 1px dashed var(--line); width: 100%; text-align: right; }

    /* Fenêtre modale */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; pointer-events: none; display: flex; justify-content: center; align-items: flex-start; transition: 0.3s; padding: 40px 20px; overflow-y: auto; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--modal-bg); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 850px; padding: 50px; position: relative; transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.1, 0, 0.1, 1); box-shadow: 0 30px 60px rgba(0,0,0,0.5); margin-bottom: 40px; color: var(--text); }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

    .modal-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
    .action-btn { background: var(--btn-bg); border: 1px solid var(--line); color: var(--text); width: 44px; height: 44px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: grid; place-items: center; transition: 0.2s; }
    .action-btn:hover { background: var(--cyan); color: #fff; }
    .close-btn:hover { background: var(--pink); transform: rotate(90deg); }

    .modal-header { border-bottom: 2px solid var(--line); padding-bottom: 20px; margin-bottom: 30px; display:flex; justify-content:space-between; align-items:flex-end; }
    .modal-header h2 { margin: 10px 0 0; font-size: 2.2rem; line-height: 1.2; }
    .qcm-btn { background: linear-gradient(135deg, var(--cyan), var(--blue)); color:#fff; border:none; padding:10px 20px; border-radius:999px; font-weight:bold; cursor:pointer; transition:transform 0.2s; }
    .qcm-btn:hover { transform:scale(1.05); }

    .modal-body p { font-size: 1.15rem; line-height: 1.8; margin-bottom: 20px; color: var(--text); text-align: justify; }
    .modal-body p strong { color: var(--cyan); }
    .modal-body ol { font-size: 1.15rem; line-height: 1.8; }

    /* Schemas */
    .schemas-wrapper { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
    .schema-container { flex: 1; min-width: 250px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 15px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .schema-container img { max-width: 100%; max-height: 350px; border-radius: 8px; object-fit: contain; }
    .schema-caption { margin-top: 10px; font-size: 0.9rem; color: var(--muted); font-style: italic; }

    /* Styles du QCM */
    #qcmContainer { display:none; background:var(--panel); padding:25px; border-radius:16px; border:1px solid var(--line); }
    .question-block { margin-bottom: 20px; }
    .question-text { font-size:1.2rem; font-weight:bold; margin-bottom:15px; color:var(--text); }
    .options-list { display:flex; flex-direction:column; gap:10px; }
    .option-label { display:flex; align-items:center; gap:10px; padding:12px 15px; background:var(--card-bg); border:1px solid var(--line); border-radius:8px; cursor:pointer; transition:0.2s; font-size:1.1rem; }
    .option-label:hover { background:rgba(255,255,255,0.1); }
    .option-label.correct { background:rgba(85,230,165,0.2); border-color:#55e6a5; }
    .option-label.wrong { background:rgba(255,102,196,0.2); border-color:var(--pink); }
    input[type="radio"] { accent-color: var(--cyan); transform:scale(1.2); }

    #qcmNav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
    .nav-btn { background:var(--btn-bg); border:1px solid var(--line); color:var(--text); padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; }
    .nav-btn:hover { background:var(--line); }
    #qcmScore { font-size:1.3rem; font-weight:bold; color:var(--cyan); display:none; text-align:center; margin-top:20px; }

    /* Impression */
    @media print {
      body * { visibility: hidden; }
      .modal-overlay { position: absolute; left: 0; top: 0; background: white; padding: 0; }
      .modal-content, .modal-content * { visibility: visible; color: black !important; box-shadow: none; border: none; background: white !important; }
      .modal-content { max-width: 100%; padding: 0; transform: none; position: absolute; left: 0; top: 0; }
      .action-btn, .qcm-btn { display: none; }
      .modal-body p strong { color: black !important; font-weight: 800; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="topbar">
        <div class="brand"><div class="logo">SPC</div><div class="brand-text"><strong>L'Essentiel 3ème</strong></div></div>
        <div class="top-actions">
          <button id="themeToggle" class="btn">☀️ Clair</button>
        </div>
      </div>
      <h1><span class="gradient">Révisions et Entraînement</span></h1>
      <p class="lead">Apprends les fiches de synthèse (15 lignes), teste tes connaissances avec des QCM intégrés et entraîne-toi avec des sujets type Brevet.</p>
    </header>

    <main>
      <!-- Sujets Type Brevet -->
      <section id="brevet" class="theme-block">
        <div class="theme-head"><h2 style="color: var(--pink)">🎯 Sujets Type Brevet</h2></div>
        <div class="cards" id="cardsBrevet"></div>
      </section>

      <section id="theme-a" class="theme-block">
        <div class="theme-head"><h2>Thème A : Matière</h2></div>
        <div class="cards" id="cardsA"></div>
      </section>

      <section id="theme-b" class="theme-block">
        <div class="theme-head"><h2>Thème B : Énergie</h2></div>
        <div class="cards" id="cardsB"></div>
      </section>
    </main>
  </div>

  <div id="ficheModal" class="modal-overlay" onclick="fermerModalSiClicDehors(event)">
    <div class="modal-content">
      <div class="modal-actions">
        <button class="action-btn" onclick="window.print()" title="Imprimer">🖨️</button>
        <button class="action-btn close-btn" onclick="fermerModal()" title="Fermer">×</button>
      </div>
      <div id="modalContentWrapper"></div>
    </div>
  </div>

  <script>
    const courseData = {"A": [{"num": "1", "title": "Outils mathématiques et précision", "html": "<p><strong>Précision des mesures :</strong> En sciences, aucune mesure n'est exacte. Les chiffres significatifs traduisent cette précision. Lors d'un calcul (multiplication/division), le résultat final ne doit pas comporter plus de chiffres significatifs que la donnée qui en possède le moins.</p><p><strong>Notation scientifique et ordre de grandeur :</strong> Pour manipuler des nombres très grands ou très petits, on utilise la forme <strong>a &times; 10<sup>n</sup></strong> (avec 1 &le; a &lt; 10). L'ordre de grandeur est la puissance de 10 la plus proche ; il permet de vérifier rapidement la cohérence d'un résultat.</p><p><strong>Conversions indispensables :</strong> Il est crucial de maîtriser les préfixes multiplicateurs du système international : Giga (10<sup>9</sup>), Méga (10<sup>6</sup>), kilo (10<sup>3</sup>) pour les grands, et milli (10<sup>-3</sup>), micro (10<sup>-6</sup>), nano (10<sup>-9</sup>) pour les petits. Rappel : 1 mL = 1 cm<sup>3</sup> et 1 L = 1 dm<sup>3</sup>.</p>", "images": ["images_v4/schema_A_1_1.png", "images_v4/schema_A_1_2.png"], "quiz": [{"q": "Quelle est la règle pour les chiffres significatifs lors d'une multiplication ?", "options": ["Prendre le plus grand nombre de CS", "Prendre le même nombre de CS que la donnée qui en a le moins", "Garder 2 chiffres après la virgule", "Arrondir à l'entier supérieur"], "ans": 1}, {"q": "Comment s'écrit un nombre en notation scientifique ?", "options": ["a × 10^n avec 0 < a < 1", "a × 10^n avec 1 ≤ a < 10", "a × 10^n avec a > 10", "Uniquement avec des puissances positives"], "ans": 1}, {"q": "À quelle puissance de 10 correspond le préfixe Giga ?", "options": ["10^6", "10^9", "10^-9", "10^12"], "ans": 1}, {"q": "Que permet de faire l'ordre de grandeur ?", "options": ["Avoir un résultat parfaitement exact", "Vérifier rapidement la cohérence d'un résultat", "Changer l'unité de mesure", "Calculer le nombre de nucléons"], "ans": 1}, {"q": "À quoi est équivalent 1 mL ?", "options": ["1 dm^3", "1 m^3", "1 cm^3", "1 mm^3"], "ans": 2}]}, {"num": "2", "title": "Réchauffement climatique et océans", "html": "<p><strong>Mécanismes de la montée des eaux :</strong> Contrairement aux idées reçues, la fonte de la banquise (glace flottant sur l'eau, comme les icebergs) <em>ne fait pas</em> monter le niveau des océans, car elle déplace un volume d'eau égal à son propre poids.</p><p><strong>Les véritables causes :</strong> La hausse du niveau de la mer est principalement due à deux phénomènes. D'une part, la <strong>fonte des glaces continentales</strong> (calottes glaciaires de l'Antarctique et du Groenland, glaciers de montagne) qui ajoute de l'eau nouvelle dans l'océan.</p><p><strong>La dilatation thermique :</strong> D'autre part, lorsque la température de l'eau augmente, l'agitation des molécules s'intensifie. L'eau occupe alors un volume plus important : c'est la dilatation thermique. La masse volumique de l'eau (&rho; = m / V) diminue donc lorsque l'océan se réchauffe.</p>", "images": ["images_v4/schema_A_2_1.png", "images_v4/schema_A_2_2.png"], "quiz": [{"q": "La fonte de la banquise (icebergs) fait-elle monter le niveau des océans ?", "options": ["Oui, beaucoup", "Non, elle déplace un volume égal à son poids", "Seulement en été", "Oui, par dilatation"], "ans": 1}, {"q": "Quel type de glace contribue à la montée des eaux en fondant ?", "options": ["La glace continentale", "La banquise", "Les glaçons dans un verre", "La glace de mer"], "ans": 0}, {"q": "Qu'est-ce que la dilatation thermique ?", "options": ["L'eau qui gèle", "L'augmentation du volume de l'eau quand elle se réchauffe", "La diminution du volume de l'eau", "L'évaporation de l'eau"], "ans": 1}, {"q": "Quelle est la formule de la masse volumique ?", "options": ["ρ = m × V", "ρ = V / m", "ρ = m / V", "ρ = m + V"], "ans": 2}, {"q": "Que fait la masse volumique de l'eau lorsqu'elle se réchauffe ?", "options": ["Elle augmente", "Elle reste constante", "Elle diminue", "Elle devient nulle"], "ans": 2}]}, {"num": "3", "title": "Identifier un métal par sa masse volumique", "html": "<p><strong>Propriété caractéristique :</strong> Chaque matériau possède une masse volumique (&rho;) qui lui est propre. Elle représente la masse d'un matériau pour un volume donné. Les métaux courants ont des valeurs précises : Aluminium (2,7 g/cm<sup>3</sup>), Zinc (7,1 g/cm<sup>3</sup>), Fer (7,9 g/cm<sup>3</sup>), Cuivre (9,0 g/cm<sup>3</sup>).</p><p><strong>Méthode de mesure de la masse :</strong> On utilise une balance électronique. Si l'objet doit être placé dans un récipient, il est indispensable d'utiliser la fonction <strong>Tare</strong> pour ne mesurer que la masse de l'échantillon.</p><p><strong>Méthode de mesure du volume :</strong> Pour un solide de forme irrégulière, on utilise la technique du déplacement d'eau. On lit le volume initial (V<sub>i</sub>) dans une éprouvette graduée, on immerge doucement le solide, puis on lit le volume final (V<sub>f</sub>). Le volume du solide est <strong>V = V<sub>f</sub> - V<sub>i</sub></strong>. On calcule ensuite &rho; = m / V pour identifier le métal.</p>", "images": ["images_v4/schema_A_3_1.png", "images_v4/schema_A_3_2.png"], "quiz": [{"q": "Quelle grandeur physique permet d'identifier un métal inconnu ?", "options": ["Son volume seul", "Sa masse volumique", "Sa forme", "Sa température"], "ans": 1}, {"q": "Que permet la fonction Tare d'une balance ?", "options": ["Changer d'unité", "Mesurer le volume", "Remettre à zéro avec un récipient", "Augmenter la précision"], "ans": 2}, {"q": "Comment mesure-t-on le volume d'un solide irrégulier ?", "options": ["Avec une règle", "Par déplacement d'eau dans une éprouvette", "Avec une balance", "En le pesant"], "ans": 1}, {"q": "Comment calcule-t-on le volume V du solide ?", "options": ["V = Vi + Vf", "V = Vf - Vi", "V = Vi - Vf", "V = Vf × Vi"], "ans": 1}, {"q": "Si un métal a une masse volumique de 2,7 g/cm3, de quoi s'agit-il ?", "options": ["Fer", "Cuivre", "Zinc", "Aluminium"], "ans": 3}]}, {"num": "4", "title": "Structure des atomes et éléments", "html": "<p><strong>Modèle de l'atome :</strong> L'atome est le bloc de base de la matière. Il est constitué d'un <strong>noyau central</strong> (chargé positivement) autour duquel gravitent des <strong>électrons</strong> (chargés négativement) dans un espace immense. L'atome est dit \"lacunaire\" car il est composé à 99,99% de vide.</p><p><strong>Composition du noyau :</strong> Le noyau contient des <strong>nucléons</strong>, qui se divisent en deux catégories : les protons (charge positive) et les neutrons (charge neutre). L'atome étant électriquement neutre, il possède toujours <em>autant d'électrons que de protons</em>.</p><p><strong>Notation symbolique :</strong> Un élément est représenté par <strong><sup>A</sup><sub>Z</sub>X</strong>. <strong>Z</strong> est le numéro atomique (nombre de protons). <strong>A</strong> est le nombre de masse (total des nucléons). Pour trouver le nombre de neutrons (N), on effectue simplement la soustraction : <strong>N = A - Z</strong>.</p>", "images": [], "quiz": [{"q": "De quoi est composé le noyau d'un atome ?", "options": ["D'électrons et de protons", "De protons et de neutrons", "De neutrons et d'électrons", "Uniquement de protons"], "ans": 1}, {"q": "Pourquoi dit-on que l'atome a une structure lacunaire ?", "options": ["Car il est très lourd", "Car ses électrons sont lents", "Car il est composé à 99,99% de vide", "Car il manque des protons"], "ans": 2}, {"q": "Quelle est la charge électrique globale d'un atome ?", "options": ["Positive", "Négative", "Neutre", "Variable"], "ans": 2}, {"q": "Que représente Z dans la notation symbolique ?", "options": ["Le nombre de nucléons", "Le numéro atomique (protons)", "Le nombre de neutrons", "Le nombre de masse"], "ans": 1}, {"q": "Comment calcule-t-on le nombre de neutrons N ?", "options": ["N = A + Z", "N = Z - A", "N = A - Z", "N = A × Z"], "ans": 2}]}, {"num": "6", "title": "La formation des ions", "html": "<p><strong>Définition d'un ion :</strong> Lors de certaines réactions ou dissolutions, un atome (ou un groupe d'atomes) peut gagner ou perdre un ou plusieurs électrons. Il n'est alors plus électriquement neutre et devient un <strong>ion</strong>. Attention : le noyau (les protons) ne change jamais lors de la formation d'un ion !</p><p><strong>Les Cations (positifs) :</strong> Un cation est un atome qui a <em>perdu</em> des électrons (des charges négatives). Il se retrouve donc avec un excès de charges positives. Exemple : l'ion cuivre Cu<sup>2+</sup> a perdu 2 électrons.</p><p><strong>Les Anions (négatifs) :</strong> Un anion est un atome qui a <em>gagné</em> des électrons. Il possède donc un excès de charges négatives. Exemple : l'ion chlorure Cl<sup>-</sup> a gagné 1 électron. Les solutions ioniques conduisent le courant grâce au déplacement de ces ions.</p>", "images": [], "quiz": [{"q": "Qu'est-ce qui se déplace lors de la formation d'un ion ?", "options": ["Les protons", "Les neutrons", "Les électrons", "Le noyau entier"], "ans": 2}, {"q": "Qu'est-ce qu'un cation ?", "options": ["Un ion négatif", "Un ion positif (a perdu des électrons)", "Un atome neutre", "Un ion positif (a gagné des protons)"], "ans": 1}, {"q": "Qu'est-ce qu'un anion ?", "options": ["Un ion négatif (a gagné des électrons)", "Un atome qui a perdu des électrons", "Un atome avec plus de protons", "Un groupe d'atomes neutres"], "ans": 0}, {"q": "Que signifie la notation Cu²⁺ ?", "options": ["L'atome a gagné 2 électrons", "L'atome a gagné 2 protons", "L'atome a perdu 2 électrons", "L'atome a perdu 2 protons"], "ans": 2}, {"q": "Le noyau de l'atome change-t-il quand il devient un ion ?", "options": ["Oui", "Non, jamais", "Seulement pour les anions", "Seulement pour les cations"], "ans": 1}]}, {"num": "8", "title": "Tests de reconnaissance des ions (M. Oups)", "html": "<p><strong>Le principe des tests :</strong> Pour identifier les ions invisibles dissous dans une solution aqueuse, on utilise des réactifs chimiques spécifiques. Si l'ion recherché est présent, une réaction a lieu et un solide coloré, appelé <strong>précipité</strong>, apparaît au fond du tube à essai.</p><p><strong>Test au Nitrate d'argent :</strong> Ce réactif permet de détecter l'ion chlorure (Cl<sup>-</sup>). En sa présence, il se forme un <strong>précipité blanc qui noircit à la lumière</strong>.</p><p><strong>Tests à la Soude (Hydroxyde de sodium) :</strong> La soude est le réactif de base pour repérer les ions métalliques. Elle donne un précipité <strong>bleu</strong> avec l'ion Cuivre II (Cu<sup>2+</sup>), un précipité <strong>vert</strong> avec l'ion Fer II (Fe<sup>2+</sup>), et un précipité <strong>rouille (orangé)</strong> avec l'ion Fer III (Fe<sup>3+</sup>).</p>", "images": [], "quiz": [{"q": "Qu'est-ce qu'un précipité ?", "options": ["Un gaz qui s'échappe", "Un liquide coloré", "Un solide qui se forme lors d'une réaction", "Une explosion"], "ans": 2}, {"q": "Quel ion donne un précipité blanc noircissant à la lumière avec le nitrate d'argent ?", "options": ["Ion Fer II", "Ion Chlorure", "Ion Cuivre II", "Ion Fer III"], "ans": 1}, {"q": "Quel précipité obtient-on en ajoutant de la soude à une solution contenant des ions Cuivre II (Cu²⁺) ?", "options": ["Bleu", "Vert", "Rouille", "Blanc"], "ans": 0}, {"q": "Quelle couleur de précipité indique la présence d'ions Fer II (Fe²⁺) ?", "options": ["Rouille", "Vert", "Bleu", "Blanc"], "ans": 1}, {"q": "Quel réactif utilise-t-on pour tester la présence de l'ion Fer III (Fe³⁺) ?", "options": ["L'acide chlorhydrique", "Le nitrate d'argent", "La soude", "L'eau salée"], "ans": 2}]}, {"num": "11", "title": "Solutions acides, basiques et neutres (Le pH)", "html": "<p><strong>L'échelle de pH :</strong> Le pH (potentiel Hydrogène) permet d'évaluer l'acidité d'une solution aqueuse sur une échelle allant de 0 à 14. On le mesure rapidement avec du papier pH (couleur) ou précisément avec un appareil électronique appelé <strong>pH-mètre</strong>.</p><p><strong>Interprétation microscopique :</strong> L'acidité dépend de la concentration en ions hydrogène (H<sup>+</sup>) et en ions hydroxyde (HO<sup>-</sup>). Une solution est <strong>neutre (pH = 7)</strong> quand elle contient autant d'ions H<sup>+</sup> que de HO<sup>-</sup>.</p><p><strong>Acide et Basique :</strong> Une solution est <strong>acide (pH &lt; 7)</strong> si les ions H<sup>+</sup> sont majoritaires. Elle est <strong>basique (pH &gt; 7)</strong> si les ions HO<sup>-</sup> sont majoritaires. Attention au danger : plus le pH s'éloigne de 7 (vers 0 ou vers 14), plus la solution est corrosive. Diluer un acide fait remonter son pH vers 7.</p>", "images": [], "quiz": [{"q": "Quelle est la plage de valeurs de l'échelle de pH ?", "options": ["0 à 10", "1 à 100", "0 à 14", "7 à 14"], "ans": 2}, {"q": "Comment qualifier une solution de pH = 3 ?", "options": ["Basique", "Neutre", "Acide", "Inerte"], "ans": 2}, {"q": "Quels ions sont majoritaires dans une solution acide ?", "options": ["Les ions HO-", "Les ions H+", "Les ions Cl-", "Les ions Na+"], "ans": 1}, {"q": "Que se passe-t-il si on dilue un acide avec de l'eau ?", "options": ["Son pH diminue", "Son pH augmente vers 7", "Son pH reste identique", "Son pH dépasse 7"], "ans": 1}, {"q": "Quel appareil donne la mesure la plus précise du pH ?", "options": ["Le papier pH", "Le pH-mètre", "Un thermomètre", "Le nitrate d'argent"], "ans": 1}]}, {"num": "15", "title": "Action d'un acide sur un métal", "html": "<p><strong>Observations expérimentales :</strong> Lorsqu'on verse de l'acide chlorhydrique (solution contenant des ions H<sup>+</sup> et Cl<sup>-</sup>) sur de la poudre de fer, une <strong>effervescence</strong> se produit : un gaz s'échappe. De plus, la température augmente, il s'agit d'une réaction exothermique.</p><p><strong>Identification des produits :</strong> Le gaz dégagé est du <strong>dihydrogène (H<sub>2</sub>)</strong>. On le prouve en approchant une allumette enflammée : une petite détonation (un \"pop\") se fait entendre. La solution finale devient verdâtre, indiquant la formation d'ions Fer II (Fe<sup>2+</sup>).</p><p><strong>Bilan et équation :</strong> C'est une transformation chimique où les réactifs (Fer solide et ions H<sup>+</sup>) disparaissent pour former des produits (gaz H<sub>2</sub> et ions Fe<sup>2+</sup>). L'équation bilan équilibrée s'écrit : <strong>Fe + 2 H<sup>+</sup> &rarr; H<sub>2</sub> + Fe<sup>2+</sup></strong> (les ions chlorure Cl<sup>-</sup> sont dits spectateurs).</p>", "images": [], "quiz": [{"q": "Quel gaz se dégage lors de la réaction entre le fer et l'acide chlorhydrique ?", "options": ["Dioxygène", "Dioxyde de carbone", "Dihydrogène", "Azote"], "ans": 2}, {"q": "Comment prouver la présence du dihydrogène (H2) ?", "options": ["Il trouble l'eau de chaux", "Il ravive une bûchette incandescente", "Il produit une détonation (pop) à l'approche d'une flamme", "Il forme un précipité blanc"], "ans": 2}, {"q": "Pourquoi la solution finale est-elle verdâtre ?", "options": ["À cause du chlore", "À cause de la formation d'ions Fer II (Fe²⁺)", "À cause de la température", "C'est la couleur de l'acide"], "ans": 1}, {"q": "Quels sont les réactifs dans cette expérience ?", "options": ["Dihydrogène et Fer II", "Fer et Acide chlorhydrique (ions H+)", "Fer et Dihydrogène", "Acide et Chlorure"], "ans": 1}, {"q": "Quelle est l'équation bilan équilibrée de cette réaction ?", "options": ["Fe + H+ → H2 + Fe2+", "Fe + 2 H+ → H2 + Fe2+", "2 Fe + H+ → H2 + Fe2+", "Fe + H2 → 2 H+ + Fe2+"], "ans": 1}]}], "B": [{"num": "4", "title": "L'énergie mécanique et la chute d'un corps", "html": "<p><strong>Énergie cinétique et de position :</strong> Tout objet en mouvement possède une <strong>énergie cinétique (Ec)</strong> qui dépend de sa masse et de sa vitesse : <strong>Ec = &frac12; &times; m &times; v<sup>2</sup></strong>. Tout objet en hauteur possède une <strong>énergie de position (Ep)</strong> liée à l'attraction terrestre.</p><p><strong>L'énergie mécanique (Em) :</strong> L'énergie mécanique est simplement la somme des deux : <strong>Em = Ec + Ep</strong>. C'est l'énergie totale liée au mouvement et à la position du système.</p><p><strong>Conversions et conservation :</strong> Lors de la chute libre d'un objet (comme le wagon d'une montagne russe qui descend), il perd de la hauteur (Ep diminue) mais gagne de la vitesse (Ec augmente). L'énergie de position est <strong>convertie</strong> en énergie cinétique. S'il n'y a pas de frottements de l'air, l'énergie mécanique totale se <strong>conserve</strong> (Em reste constante).</p>", "images": ["images_v4/schema_B_4_1.png", "images_v4/schema_B_4_2.png"], "quiz": [{"q": "Quelle est la formule de l'énergie cinétique (Ec) ?", "options": ["Ec = m × v", "Ec = 1/2 × m × v²", "Ec = m × g × h", "Ec = v² / m"], "ans": 1}, {"q": "De quoi dépend l'énergie de position (Ep) ?", "options": ["Uniquement de la vitesse", "De l'altitude (hauteur) de l'objet", "Du carré de la vitesse", "De la température"], "ans": 1}, {"q": "Comment calcule-t-on l'énergie mécanique (Em) ?", "options": ["Em = Ec × Ep", "Em = Ec - Ep", "Em = Ec + Ep", "Em = 1/2 × Ec"], "ans": 2}, {"q": "Lors d'une chute sans frottement, comment évoluent les énergies ?", "options": ["Ep augmente et Ec diminue", "Ep diminue et Ec augmente", "Ep et Ec diminuent", "Les deux restent constantes"], "ans": 1}, {"q": "Que dire de l'énergie mécanique (Em) lors d'une chute sans frottements ?", "options": ["Elle se conserve (reste constante)", "Elle diminue jusqu'à zéro", "Elle augmente proportionnellement", "Elle est divisée par deux"], "ans": 0}]}, {"num": "7", "title": "La pile électrochimique", "html": "<p><strong>Principe du convertisseur :</strong> Une pile est un convertisseur d'énergie. Elle transforme l'<strong>énergie chimique</strong> (stockée dans ses réactifs) en <strong>énergie électrique</strong> (utile au circuit) et dissipe inévitablement de l'<strong>énergie thermique</strong> (chaleur perdue).</p><p><strong>Fonctionnement microscopique :</strong> Dans une pile Cuivre-Zinc, le pôle négatif (anode) est la lame de zinc. Les atomes de zinc s'usent en perdant des électrons pour devenir des ions Zn<sup>2+</sup> dans la solution. Ces électrons voyagent dans les fils électriques, créant le courant.</p><p><strong>Bilan de la pile :</strong> Arrivés au pôle positif (cathode en cuivre), les électrons réagissent avec les ions Cu<sup>2+</sup> de la solution pour former un dépôt d'atomes de cuivre solide. L'équation globale est : <strong>Zn + Cu<sup>2+</sup> &rarr; Zn<sup>2+</sup> + Cu</strong>.</p>", "images": ["images_v4/schema_B_7_1.png", "images_v4/schema_B_7_2.png"], "quiz": [{"q": "Quelle conversion d'énergie a lieu dans une pile ?", "options": ["Électrique vers Chimique", "Chimique vers Électrique et Thermique", "Thermique vers Électrique", "Mécanique vers Électrique"], "ans": 1}, {"q": "Dans une pile Cuivre-Zinc, quel métal constitue le pôle négatif ?", "options": ["Le Cuivre", "Le Zinc", "Le Fer", "L'Argent"], "ans": 1}, {"q": "Que font les atomes de Zinc au cours du fonctionnement de la pile ?", "options": ["Ils gagnent des électrons", "Ils se multiplient", "Ils perdent des électrons (et s'usent)", "Ils restent intacts"], "ans": 2}, {"q": "Quelle est l'énergie considérée comme 'perdue' ou dissipée par une pile ?", "options": ["L'énergie lumineuse", "L'énergie cinétique", "L'énergie thermique (chaleur)", "L'énergie nucléaire"], "ans": 2}, {"q": "Quelle est l'équation globale de fonctionnement de la pile Cuivre-Zinc ?", "options": ["Zn + Cu2+ → Zn2+ + Cu", "Zn2+ + Cu → Zn + Cu2+", "Zn + Cu → Zn2+ + Cu2+", "2 Zn + Cu → Zn + 2 Cu"], "ans": 0}]}, {"num": "8", "title": "Production industrielle d'électricité", "html": "<p><strong>Le point commun des centrales :</strong> Qu'elle soit nucléaire, thermique à flamme, hydraulique ou éolienne, toute centrale électrique produit du courant grâce à un composant central indispensable : <strong>l'Alternateur</strong>.</p><p><strong>Rotor, Stator et Turbine :</strong> L'alternateur est composé d'une bobine de cuivre fixe (le <strong>stator</strong>) et d'un électro-aimant mobile (le <strong>rotor</strong>). Pour faire tourner ce rotor, on utilise une <strong>turbine</strong> mise en mouvement par de l'eau, du vent, ou de la vapeur sous très haute pression.</p><p><strong>Sources d'énergie primaire :</strong> L'énergie initiale servant à faire tourner la turbine peut être renouvelable (inépuisable à l'échelle humaine : vent, soleil, eau) ou non renouvelable (stocks limités : uranium, pétrole, charbon, gaz naturel).</p>", "images": ["images_v4/schema_B_8_1.png"], "quiz": [{"q": "Quel est le composant commun à presque toutes les centrales électriques ?", "options": ["Le panneau solaire", "L'Alternateur", "La chaudière à gaz", "L'Uranium"], "ans": 1}, {"q": "Comment appelle-t-on la partie mobile (tournante) d'un alternateur ?", "options": ["Le stator", "Le rotor", "La prise", "L'hélice"], "ans": 1}, {"q": "À quoi sert la turbine dans une centrale ?", "options": ["À faire tourner le rotor de l'alternateur", "À refroidir l'eau", "À stocker l'électricité", "À créer de l'uranium"], "ans": 0}, {"q": "Parmi ces sources d'énergie, laquelle est renouvelable ?", "options": ["Le charbon", "L'uranium", "Le vent (éolien)", "Le gaz naturel"], "ans": 2}, {"q": "L'énergie nucléaire utilise de l'uranium. Est-ce une source d'énergie renouvelable ?", "options": ["Oui, car elle ne pollue pas", "Non, car les stocks sur Terre sont limités", "Oui, l'uranium se recrée vite", "Cela dépend de la saison"], "ans": 1}]}, {"num": "9", "title": "Le phénomène d'induction", "html": "<p><strong>Créer du courant sans pile :</strong> Il est possible de générer une tension électrique avec seulement deux éléments : un <strong>aimant</strong> (qui crée un champ magnétique) et une <strong>bobine de fil conducteur</strong>. C'est ce principe qui est utilisé dans les dynamos de vélo.</p><p><strong>Condition de mouvement :</strong> Pour que le courant apparaisse, il faut absolument qu'il y ait un <strong>mouvement relatif</strong> entre l'aimant et la bobine. Si l'aimant est immobile à l'intérieur de la bobine, la tension mesurée par le voltmètre est nulle (0 V).</p><p><strong>Tension alternative :</strong> Le mouvement de va-et-vient (ou la rotation continue) génère une tension qui change sans cesse de signe (positive, puis négative, etc.). On l'appelle une tension <strong>alternative</strong>. Plus le mouvement est rapide, plus la tension maximale générée sera élevée.</p>", "images": ["images_v4/schema_B_9_1.png", "images_v4/schema_B_9_2.png"], "quiz": [{"q": "Quels sont les deux composants nécessaires pour générer du courant par induction ?", "options": ["Un fil de fer et du sel", "Une pile et une lampe", "Un aimant et une bobine de cuivre", "Un condensateur et une diode"], "ans": 2}, {"q": "Que se passe-t-il si l'aimant est complètement immobile à l'intérieur de la bobine ?", "options": ["La tension est maximale", "La tension mesurée est nulle (0 V)", "La bobine chauffe", "Il y a un court-circuit"], "ans": 1}, {"q": "Comment appelle-t-on une tension qui change de signe (positive puis négative) ?", "options": ["Tension continue", "Tension alternative", "Tension nulle", "Tension fixe"], "ans": 1}, {"q": "Quel est l'effet de la vitesse de mouvement de l'aimant ?", "options": ["Plus c'est rapide, plus la tension max est élevée", "La vitesse ne change rien", "Plus c'est rapide, plus la tension est faible", "Ça détruit l'aimant"], "ans": 0}, {"q": "Où retrouve-t-on principalement ce phénomène au quotidien ?", "options": ["Dans une pile bouton", "Dans une dynamo de vélo ou un alternateur", "Dans un écran de smartphone", "Dans une batterie de voiture"], "ans": 1}]}, {"num": "10", "title": "Caractéristiques de la tension du secteur", "html": "<p><strong>Nature du courant domestique :</strong> La tension délivrée par les prises de courant (Réseau EDF en France) n'est pas continue comme celle d'une pile. C'est une tension <strong>alternative</strong> (change de sens) et <strong>sinusoïdale</strong> (sa courbe forme des vagues régulières).</p><p><strong>Tension maximale et efficace :</strong> La tension du secteur oscille entre un maximum (U<sub>max</sub> = 325 V) et un minimum (U<sub>min</sub> = -325 V). Cependant, la valeur utile inscrite sur les appareils est la <strong>tension efficace (U<sub>eff</sub>)</strong>, qui vaut 230 V. La relation est : U<sub>max</sub> = U<sub>eff</sub> &times; &radic;2.</p><p><strong>Période et Fréquence :</strong> La tension reproduit un motif élémentaire de manière cyclique. La <strong>période (T)</strong> est la durée de ce motif. La <strong>fréquence (f)</strong> est le nombre de motifs par seconde. En France, f = 50 Hz, ce qui donne une période très courte de T = 1/50 = 0,02 seconde !</p>", "images": ["images_v4/schema_B_10_1.png", "images_v4/schema_B_10_2.png"], "quiz": [{"q": "Quelle est la forme de la courbe d'une tension du secteur sur un graphique ?", "options": ["Une ligne droite horizontale", "Une courbe sinusoïdale (vagues)", "Des escaliers carrés", "Une diagonale constante"], "ans": 1}, {"q": "Quelle est la valeur de la tension efficace (U_eff) distribuée par EDF en France ?", "options": ["325 V", "12 V", "230 V", "50 V"], "ans": 2}, {"q": "Comment relie-t-on la tension maximale et la tension efficace ?", "options": ["U_max = U_eff × √2", "U_eff = U_max × √2", "U_max = U_eff / 2", "Elles sont toujours égales"], "ans": 0}, {"q": "Que représente la fréquence f ?", "options": ["Le temps d'une oscillation complète", "Le nombre d'oscillations (motifs) par seconde", "La hauteur de la vague en Volts", "La consommation de l'appareil"], "ans": 1}, {"q": "Quelle est la fréquence du courant en France ?", "options": ["60 Hz", "230 Hz", "50 Hz", "0.02 Hz"], "ans": 2}]}, {"num": "11", "title": "Comprendre et utiliser un oscilloscope", "html": "<p><strong>Qu'est-ce qu'un oscilloscope ?</strong> C'est un appareil de mesure qui permet de visualiser l'évolution d'une tension électrique au cours du temps. L'écran affiche une courbe appelée un oscillogramme.</p><p><strong>Lecture de l'axe horizontal (le Temps) :</strong> L'axe des abscisses (X) représente le temps. Il est paramétré par le <strong>balayage</strong> (noté <em>b</em>, en ms/DIV ou s/DIV). Pour trouver la période (T) d'un signal, on compte le nombre de carreaux (X) d'un motif complet : <strong>T = b &times; X</strong>.</p><p><strong>Lecture de l'axe vertical (la Tension) :</strong> L'axe des ordonnées (Y) représente la tension. Il est réglé par la <strong>sensibilité verticale</strong> (notée <em>s</em>, en V/DIV). Pour trouver la tension maximale (U<sub>max</sub>), on mesure la hauteur en carreaux (Y) du pic par rapport au centre : <strong>U<sub>max</sub> = s &times; Y</strong>.</p>", "images": ["images_v4/schema_B_11_1.png", "images_v4/schema_B_11_2.png"], "quiz": [{"q": "Que représente l'axe horizontal (abscisses) sur l'écran d'un oscilloscope ?", "options": ["La tension", "La masse", "Le temps", "L'intensité"], "ans": 2}, {"q": "Que représente l'axe vertical (ordonnées) sur l'écran d'un oscilloscope ?", "options": ["Le temps", "La tension électrique", "La fréquence", "La température"], "ans": 1}, {"q": "Quelle formule utilise-t-on pour calculer la Période (T) à partir de l'écran ?", "options": ["T = sensibilité × Y", "T = balayage × nombre de divisions horizontales (X)", "T = X / balayage", "T = s × b"], "ans": 1}, {"q": "À quoi sert la sensibilité verticale (notée 's') ?", "options": ["À régler l'échelle du temps (axe X)", "À régler l'échelle de la tension (axe Y)", "À régler la luminosité de l'écran", "À générer le courant"], "ans": 1}, {"q": "Quelle formule permet de calculer la tension maximale (U_max) à l'oscilloscope ?", "options": ["U_max = b × X", "U_max = s × nombre de divisions verticales (Y)", "U_max = Y / s", "U_max = 230 × √2"], "ans": 1}]}]};
    const brevetSubjects = [{"title": "Sujet Brevet Type 1 : Le Mystère de l'Épave (Thème A)", "theme": "A", "html": "\n        <h3>Contexte</h3>\n        <p>Un plongeur découvre une pièce métallique au fond de l'océan. Pour identifier le métal sans l'abîmer, il procède à plusieurs mesures en laboratoire. Il décide d'utiliser la méthode de déplacement d'eau pour déterminer son volume, puis il étudie une réaction chimique pour confirmer son hypothèse.</p>\n\n        <h4>Partie 1 : Identification du métal (10 points)</h4>\n        <p>Le plongeur pèse la pièce : la balance affiche <strong>m = 158 g</strong>.<br>Il verse 50 mL d'eau dans une éprouvette graduée (V<sub>i</sub>). Il y plonge la pièce métallique. L'eau monte alors jusqu'à la graduation 70 mL (V<sub>f</sub>).</p>\n        <ol>\n            <li><strong>(2 pts)</strong> Calculez le volume V de la pièce métallique en mL, puis en cm³. Détaillez le calcul.</li>\n            <li><strong>(4 pts)</strong> Rappelez la formule de la masse volumique (&rho;). Calculez la masse volumique de ce métal en g/cm³.</li>\n            <li><strong>(4 pts)</strong> À l'aide des données ci-dessous, identifiez le métal qui constitue la pièce trouvée par le plongeur. Justifiez.\n                <br><em>Données : &rho;<sub>Aluminium</sub> = 2,7 g/cm³ ; &rho;<sub>Zinc</sub> = 7,1 g/cm³ ; &rho;<sub>Fer</sub> = 7,9 g/cm³ ; &rho;<sub>Cuivre</sub> = 9,0 g/cm³</em>\n            </li>\n        </ol>\n\n        <h4>Partie 2 : Réaction chimique avec l'acide (10 points)</h4>\n        <p>Pour confirmer qu'il s'agit bien du métal identifié (le Fer), un laborantin dépose quelques gouttes d'acide chlorhydrique (solution contenant des ions H⁺ et Cl⁻) sur un éclat de cette pièce. Il observe une effervescence (dégagement de gaz) et la solution devient verte.</p>\n        <ol>\n            <li><strong>(3 pts)</strong> Quel gaz responsable de l'effervescence est produit lors de l'action de l'acide sur le fer ? Comment peut-on prouver sa présence expérimentalement ?</li>\n            <li><strong>(2 pts)</strong> Quel ion, responsable de la coloration verte, s'est formé dans la solution ? (Donnez son nom et sa formule).</li>\n            <li><strong>(5 pts)</strong> Écrivez l'équation-bilan équilibrée de la réaction chimique entre le fer et l'acide chlorhydrique.</li>\n        </ol>\n        <hr>\n        <button class=\"btn\" onclick=\"document.getElementById('correction-b1').style.display='block'\">Afficher le corrigé</button>\n        <div id=\"correction-b1\" style=\"display:none; margin-top:15px; padding:15px; background:rgba(104,228,255,0.1); border-left:4px solid #68e4ff;\">\n            <strong>Correction rapide :</strong><br>\n            <strong>Partie 1 :</strong><br>\n            1. V = Vf - Vi = 70 - 50 = 20 mL. Sachant que 1 mL = 1 cm³, V = 20 cm³.<br>\n            2. Formule : ρ = m / V = 158 / 20 = 7,9 g/cm³.<br>\n            3. D'après les données, la masse volumique de 7,9 g/cm³ correspond au Fer.<br>\n            <strong>Partie 2 :</strong><br>\n            1. Le gaz est le Dihydrogène (H2). On l'identifie en approchant une allumette enflammée : on entend une petite détonation (\"pop\").<br>\n            2. C'est l'ion Fer II (Fe²⁺).<br>\n            3. Fe + 2 H⁺ → H₂ + Fe²⁺.\n        </div>\n        "}, {"title": "Sujet Brevet Type 2 : Fête Foraine et Énergie (Thème B)", "theme": "B", "html": "\n        <h3>Contexte</h3>\n        <p>Dans un parc d'attractions, un wagon de montagnes russes de masse m = 400 kg est lâché sans vitesse initiale depuis le sommet d'une piste situé à 20 mètres de haut. Plus tard dans le parc, on s'intéresse au système d'éclairage des vélos en libre-service équipés de dynamos.</p>\n\n        <h4>Partie 1 : Les montagnes russes (10 points)</h4>\n        <p>On suppose qu'il n'y a aucun frottement (ni sur les rails, ni avec l'air).</p>\n        <ol>\n            <li><strong>(3 pts)</strong> Décrivez les conversions d'énergie qui ont lieu lors de la descente du wagon (quelles énergies augmentent, diminuent, et pourquoi).</li>\n            <li><strong>(3 pts)</strong> Que peut-on dire de l'énergie mécanique (Em) du wagon tout au long de sa chute ? Pourquoi ?</li>\n            <li><strong>(4 pts)</strong> Au point le plus bas de la piste (hauteur 0 m), la vitesse du wagon atteint 20 m/s. En utilisant la formule appropriée, calculez l'énergie cinétique (Ec) du wagon à ce moment. Détaillez le calcul et précisez l'unité.</li>\n        </ol>\n\n        <h4>Partie 2 : L'alternateur du vélo (10 points)</h4>\n        <p>Le phare du vélo est alimenté par une dynamo (qui est en réalité un alternateur) qui frotte sur la roue.</p>\n        <ol>\n            <li><strong>(3 pts)</strong> Quels sont les deux composants principaux présents à l'intérieur d'un alternateur permettant de créer du courant par induction ?</li>\n            <li><strong>(3 pts)</strong> Pourquoi est-il indispensable que le cycliste pédale (et donc que la roue tourne) pour que la lampe s'allume ?</li>\n            <li><strong>(4 pts)</strong> On relie la dynamo à un oscilloscope. Le balayage est réglé sur <strong>b = 5 ms/DIV</strong> et le motif élémentaire s'étale sur <strong>4 divisions horizontales</strong>. Calculez la période T du signal en millisecondes, puis convertissez-la en secondes.</li>\n        </ol>\n        <hr>\n        <button class=\"btn\" onclick=\"document.getElementById('correction-b2').style.display='block'\">Afficher le corrigé</button>\n        <div id=\"correction-b2\" style=\"display:none; margin-top:15px; padding:15px; background:rgba(165,107,255,0.1); border-left:4px solid #a56bff;\">\n            <strong>Correction rapide :</strong><br>\n            <strong>Partie 1 :</strong><br>\n            1. Lors de la descente, l'altitude diminue, donc l'énergie de position (Ep) diminue. La vitesse augmente, donc l'énergie cinétique (Ec) augmente. L'Ep est convertie en Ec.<br>\n            2. L'énergie mécanique se conserve (reste constante) car il n'y a pas de frottements.<br>\n            3. Ec = 1/2 × m × v² = 0.5 × 400 × 20² = 0.5 × 400 × 400 = 80 000 Joules (ou 80 kJ).<br>\n            <strong>Partie 2 :</strong><br>\n            1. Un aimant (le rotor) et une bobine de cuivre (le stator).<br>\n            2. Il faut un mouvement relatif entre l'aimant et la bobine pour générer une tension par induction (l'énergie mécanique est convertie en énergie électrique).<br>\n            3. T = b × X = 5 × 4 = 20 ms. En secondes : T = 20 / 1000 = 0,02 s.\n        </div>\n        "}];

    let currentQuiz = [];
    let currentQIndex = 0;
    let score = 0;

    function generateHTML() {
      // Brevet Cards
      const cardsBrevet = document.getElementById("cardsBrevet");
      let htmlBrevet = "";
      brevetSubjects.forEach((sub, index) => {
         const color = sub.theme === 'A' ? 'var(--cyan)' : 'var(--violet)';
         htmlBrevet += `<div class="card" style="--accent: ${color}" onclick="ouvrirBrevet(${index})">
          <div class="card-top"><span class="seq" style="background:var(--pink); color:#fff;">Sujet Brevet</span></div>
          <h3>${sub.title}</h3><p>Entraîne-toi sur ce sujet (10 à 20 points) corrigé !</p>
          <div class="open-btn" style="color:var(--pink);">Faire le sujet ➔</div></div>`;
      });
      cardsBrevet.innerHTML = htmlBrevet;

      // Theme A
      const cardsA = document.getElementById("cardsA");
      let htmlA = "";
      courseData.A.forEach((seq, index) => { 
        htmlA += `<div class="card" style="--accent: var(--cyan)" onclick="ouvrirModal('A', ${index})">
        <div class="card-top"><span class="seq">Séquence ${seq.num}</span></div>
        <h3>${seq.title}</h3><p>Fiche de synthèse + QCM (5 questions)</p>
        <div class="open-btn">Ouvrir la séquence ➔</div></div>`; 
      }); 
      cardsA.innerHTML = htmlA;

      // Theme B
      const cardsB = document.getElementById("cardsB");
      let htmlB = "";
      courseData.B.forEach((seq, index) => { 
        htmlB += `<div class="card" style="--accent: var(--violet)" onclick="ouvrirModal('B', ${index})">
        <div class="card-top"><span class="seq">Séquence ${seq.num}</span></div>
        <h3>${seq.title}</h3><p>Fiche de synthèse + QCM (5 questions)</p>
        <div class="open-btn">Ouvrir la séquence ➔</div></div>`; 
      }); 
      cardsB.innerHTML = htmlB;
    }

    function ouvrirModal(themeKey, index) {
      const seq = courseData[themeKey][index];
      const themeColor = themeKey === 'A' ? 'var(--cyan)' : 'var(--violet)';
      currentQuiz = seq.quiz || [];

      let imagesHTML = "";
      if (seq.images && seq.images.length > 0) {
        imagesHTML = `<div class="schemas-wrapper">`;
        seq.images.forEach((imgSrc, i) => {
            imagesHTML += `<div class="schema-container"><img src="${imgSrc}" alt="Schéma"><div class="schema-caption">Illustration du cours</div></div>`;
        });
        imagesHTML += `</div>`;
      }

      document.getElementById('modalContentWrapper').innerHTML = `
        <div id="ficheView">
            <div class="modal-header">
              <div>
                  <span style="color: ${themeColor}; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">
                    Thème ${themeKey} — Séquence ${seq.num}
                  </span>
                  <h2>${seq.title}</h2>
              </div>
              <button class="qcm-btn" onclick="startQCM()">🎓 Lancer le QCM</button>
            </div>
            <div class="modal-body">
              ${imagesHTML}
              ${seq.html}
            </div>
        </div>

        <div id="qcmContainer">
            <h2 style="margin-top:0; color:${themeColor}">QCM : ${seq.title}</h2>
            <div id="qcmContent"></div>
            <div id="qcmNav">
                <span id="qcmProgress" style="color:var(--muted); font-weight:bold;"></span>
                <button class="nav-btn" id="nextQBtn" onclick="nextQuestion()" style="display:none;">Question suivante ➔</button>
            </div>
            <div id="qcmScore"></div>
        </div>
      `;
      document.getElementById('ficheModal').classList.add('active');
    }

    function ouvrirBrevet(index) {
      const sub = brevetSubjects[index];
      const themeColor = sub.theme === 'A' ? 'var(--cyan)' : 'var(--violet)';

      document.getElementById('modalContentWrapper').innerHTML = `
        <div class="modal-header">
          <span style="color: var(--pink); font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">Entraînement Brevet</span>
          <h2>${sub.title}</h2>
        </div>
        <div class="modal-body">${sub.html}</div>
      `;
      document.getElementById('ficheModal').classList.add('active');
    }

    // --- LOGIQUE DU QCM ---
    function startQCM() {
        document.getElementById('ficheView').style.display = 'none';
        document.getElementById('qcmContainer').style.display = 'block';
        currentQIndex = 0;
        score = 0;
        showQuestion();
    }

    function showQuestion() {
        if(currentQIndex >= currentQuiz.length) {
            endQCM();
            return;
        }
        const qData = currentQuiz[currentQIndex];
        let optionsHtml = "";
        qData.options.forEach((opt, i) => {
            optionsHtml += `
            <label class="option-label" id="lbl-${i}">
                <input type="radio" name="qcm_opt" value="${i}" onclick="checkAnswer(${i}, ${qData.ans})">
                ${opt}
            </label>`;
        });

        document.getElementById('qcmContent').innerHTML = `
            <div class="question-block">
                <div class="question-text">${qData.q}</div>
                <div class="options-list">${optionsHtml}</div>
            </div>
        `;
        document.getElementById('qcmProgress').innerText = `Question ${currentQIndex + 1} / ${currentQuiz.length}`;
        document.getElementById('nextQBtn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, correctIndex) {
        // Disable all inputs
        const inputs = document.querySelectorAll('input[name="qcm_opt"]');
        inputs.forEach(inp => inp.disabled = true);

        // Highlight logic
        for(let i=0; i<4; i++) {
            const lbl = document.getElementById(`lbl-${i}`);
            if(!lbl) continue;
            if(i === correctIndex) {
                lbl.classList.add('correct');
            } else if (i === selectedIndex && selectedIndex !== correctIndex) {
                lbl.classList.add('wrong');
            }
        }

        if(selectedIndex === correctIndex) score++;
        document.getElementById('nextQBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQIndex++;
        showQuestion();
    }

    function endQCM() {
        document.getElementById('qcmContent').innerHTML = "";
        document.getElementById('qcmNav').style.display = "none";
        const scoreDiv = document.getElementById('qcmScore');
        scoreDiv.style.display = "block";

        let msg = "";
        if(score === 5) msg = "Parfait ! Maîtrise totale 🌟";
        else if (score >= 3) msg = "Très bien ! Bonnes bases 👍";
        else msg = "Oups ! Il faut relire la fiche 📖";

        scoreDiv.innerHTML = `Quiz terminé !<br><br>Ton score : ${score} / 5<br><span style="color:var(--text); font-size:1rem;">${msg}</span>
        <br><br><button class="nav-btn" onclick="document.getElementById('ficheView').style.display='block'; document.getElementById('qcmContainer').style.display='none';">Retour à la fiche</button>`;
    }

    // --- FERMETURE ---
    function fermerModal() { document.getElementById('ficheModal').classList.remove('active'); }
    function fermerModalSiClicDehors(event) { if (event.target.id === 'ficheModal') fermerModal(); }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerModal(); });

    // --- THEME ---
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      themeBtn.innerHTML = document.body.classList.contains('light-theme') ? '🌙 Sombre' : '☀️ Clair';
    });

    generateHTML();
  </script>
</body>
</html>
